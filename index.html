<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="투자알림" />
  <meta name="theme-color" content="#111827" />
  <title>투자 알림</title>
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F9FAFB; color: #111827; max-width: 480px; margin: 0 auto; min-height: 100dvh; }
    .header { background: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E5E7EB; position: sticky; top: 0; z-index: 10; }
    .header-title { font-size: 18px; font-weight: 600; }
    .header-sub { font-size: 11px; color: #9CA3AF; margin-top: 2px; }
    .header-btns { display: flex; gap: 8px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: #F3F4F6; border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .alert-banner { background: #FAEEDA; padding: 10px 16px; font-size: 13px; color: #854F0B; font-weight: 500; display: none; align-items: center; gap: 6px; border-bottom: 1px solid #EF9F27; }
    .summary-box { margin: 12px 16px 4px; background: #fff; border-radius: 14px; padding: 16px; border: 1px solid #E5E7EB; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; }
    .summary-label { font-size: 13px; color: #6B7280; font-weight: 500; margin-bottom: 4px; }
    .summary-rate { font-size: 15px; font-weight: 700; }
    .summary-amount { font-size: 20px; font-weight: 700; text-align: right; }
    .summary-total { font-size: 12px; color: #9CA3AF; text-align: right; margin-top: 2px; }
    .summary-divider { height: 1px; background: #F3F4F6; margin: 12px 0; }
    .positive { color: #D85A30; }
    .negative { color: #1D9E75; }
    .group-header { font-size: 13px; font-weight: 600; color: #6B7280; padding: 16px 16px 6px; letter-spacing: 0.3px; }
    .stock-list { padding: 0 0 100px; }
    .stock-card { background: #fff; margin: 6px 16px 0; border-radius: 12px; padding: 14px; border: 1px solid #E5E7EB; border-left-width: 4px; cursor: pointer; }
    .stock-card:active { opacity: 0.7; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .stock-name { font-size: 16px; font-weight: 600; }
    .stock-code { font-size: 12px; color: #6B7280; margin-top: 2px; }
    .action-badge { padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .metrics-row { display: grid; grid-template-columns: 1fr 1fr 1fr; }
    .metric-label { font-size: 11px; color: #9CA3AF; margin-bottom: 2px; }
    .metric-value { font-size: 14px; font-weight: 600; }
    .profit-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #F3F4F6; }
    .profit-label { font-size: 12px; color: #9CA3AF; }
    .profit-value { font-size: 14px; font-weight: 600; }
    .fab { position: fixed; bottom: 32px; right: 24px; width: 56px; height: 56px; border-radius: 50%; background: #111827; border: none; color: #fff; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 100; }
    .empty { text-align: center; padding: 80px 24px; }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: 600; color: #374151; margin-bottom: 8px; }
    .empty-desc { font-size: 14px; color: #9CA3AF; line-height: 1.6; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: flex-end; justify-content: center; z-index: 200; }
    .modal-bg.open { display: flex; }
    .modal { background: #fff; border-radius: 20px 20px 0 0; padding: 20px 16px 48px; width: 100%; max-width: 480px; max-height: 90dvh; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-close { background: #F3F4F6; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 16px; }
    .form-label { font-size: 12px; color: #6B7280; margin: 12px 0 4px; display: block; }
    .form-input { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #D1D5DB; border-radius: 8px; background: #F9FAFB; color: #111827; }
    .form-input:disabled { color: #9CA3AF; background: #F3F4F6; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .code-row { display: flex; gap: 8px; }
    .fetch-btn { padding: 0 14px; background: #374151; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .save-btn { width: 100%; padding: 14px; background: #111827; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; }
    .delete-btn { width: 100%; padding: 12px; background: #fff; color: #E24B4A; border: 1px solid #E24B4A; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; display: none; }
    .quick-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .quick-chips::-webkit-scrollbar { display: none; }
    .chip { padding: 6px 14px; border-radius: 999px; background: #fff; border: 1px solid #D1D5DB; font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .chip.active { background: #111827; color: #fff; border-color: #111827; }
    .loading { text-align: center; padding: 60px; color: #9CA3AF; font-size: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="header-title">📈 투자 알림</div>
      <div class="header-sub" id="last-updated"></div>
    </div>
    <div class="header-btns">
      <button class="icon-btn" onclick="refreshData()">🔄</button>
      <button class="icon-btn" onclick="alert('종목 탭: 수정/삭제\n🔄 버튼: 수동 새로고침\n5분마다 자동 갱신')">⚙️</button>
    </div>
  </div>

  <div id="alert-banner" class="alert-banner">⚠️ <span id="alert-text"></span></div>
  <div id="summary"></div>
  <div id="stock-list" class="stock-list"></div>
  <button class="fab" onclick="openAddModal()">+</button>

  <div class="modal-bg" id="add-modal">
    <div class="modal">
      <div class="modal-title">
        <span id="modal-title-text">종목 추가</span>
        <button class="modal-close" onclick="closeAddModal()">✕</button>
      </div>
      <div class="quick-chips" id="quick-chips"></div>
      <label class="form-label">종목코드</label>
      <div class="code-row">
        <input class="form-input" id="f-code" placeholder="005380 또는 QQQ" style="flex:1" />
        <button class="fetch-btn" id="fetch-btn" onclick="fetchPrice()">현재가 조회</button>
      </div>
      <label class="form-label">종목명</label>
      <input class="form-input" id="f-name" placeholder="예: 현대차" />
      <div class="form-row">
        <div><label class="form-label">매입가 (평단)</label><input class="form-input" id="f-buy" type="number" placeholder="75000" /></div>
        <div><label class="form-label">현재가</label><input class="form-input" id="f-cur" type="number" placeholder="자동 조회" /></div>
      </div>
      <div class="form-row">
        <div><label class="form-label">추적 최고점</label><input class="form-input" id="f-high" type="number" placeholder="역대 최고가" /></div>
        <div><label class="form-label">보유 주수</label><input class="form-input" id="f-qty" type="number" placeholder="100" /></div>
      </div>
      <button class="save-btn" id="save-btn" onclick="saveStock()">종목 추가</button>
      <button class="delete-btn" id="delete-btn" onclick="deleteCurrentStock()">🗑 이 종목 삭제</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
